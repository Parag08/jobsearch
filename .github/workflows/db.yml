# Schema changes through git - ADDITIVE migrations only (switched 2026-09-24).
#
# This workflow used to re-apply schema.sql on every push that touched it, which dropped
# and recreated every table. That was right while all data was regenerable from
# data/cvbuilder/. It stopped being right the moment the app started holding things
# typed by hand - interview answers and practice attempts - so it now applies only the
# new numbered files in supabase/migrations/, each once, never dropping anything.
#
# Needs one repo secret: SUPABASE_DB_URL (Settings -> Secrets and variables -> Actions,
# the REPOSITORY section) - the session-pooler connection string, password included.
name: db

on:
  push:
    branches: [main]
    paths: [supabase/migrations/**]
  workflow_dispatch: # manual run button in the Actions tab

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run db:migrate
